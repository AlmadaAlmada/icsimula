# Pipeline principal de CI/CD
# Commit/PR → Dependências → Qualidade → Testes → Segurança → Build (artefato) → Deploy → Smoke test
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Princípio do menor privilégio: cada job pede apenas o que precisa.
permissions:
  contents: read

# Cancela execuções antigas do mesmo branch/PR quando chega um commit novo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Qualidade: formatação, lint/análise estática e checagem de tipos
  # ---------------------------------------------------------------------------
  quality:
    name: Qualidade (format, lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependências (lockfile exato)
        run: npm ci
      - name: Prettier (formatação)
        run: npm run format:check
      - name: ESLint (lint + análise estática + regras de segurança)
        run: npm run lint
      - name: TypeScript (checagem de tipos)
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # 2. Testes automatizados com cobertura mínima obrigatória
  # ---------------------------------------------------------------------------
  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest + cobertura (falha se < limites do vite.config.ts)
        run: npm run test:coverage
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["## 🧪 Cobertura de testes", "", "| Métrica | % | Cobertos |", "|---|---|---|",
                ...["lines","statements","functions","branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publicar relatórios de teste/cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: |
            coverage/
            reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Segurança: dependências vulneráveis e segredos no código/histórico
  #    (SAST com CodeQL roda no workflow codeql.yml)
  # ---------------------------------------------------------------------------
  security:
    name: Segurança (dependências + secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comentário do dependency-review no PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # histórico completo para o secret scanning
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (falha com vulnerabilidade alta/crítica)
        run: npm audit --audit-level=high
      - name: Verificar assinaturas/proveniência dos pacotes npm
        run: npm audit signatures
      - name: Dependency Review (somente em PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure
      - name: Instalar Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks (secret scanning em todo o histórico)
        run: gitleaks git --config .gitleaks.toml --redact --verbose --report-format sarif --report-path gitleaks.sarif .
      - name: Publicar relatório do Gitleaks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. Build: só executa se TODAS as validações anteriores passarem
  # ---------------------------------------------------------------------------
  build:
    name: Build e artefato
    runs-on: ubuntu-latest
    needs: [quality, test, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build de produção (Vite)
        env:
          # GitHub Pages publica em https://<usuario>.github.io/<repositorio>/
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Fallback de SPA e checksums do artefato
        run: |
          cp dist/index.html dist/404.html
          (cd dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          {
            echo "## 📦 Artefato gerado"
            echo ""
            echo '```'
            cat dist/version.json
            echo '```'
            echo ""
            echo "| Arquivo | Tamanho |"
            echo "|---|---|"
            find dist -type f -printf '| %P | %s bytes |\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar artefato do build (download/rastreabilidade)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: icsimula-dist-${{ github.sha }}
          path: dist/
          retention-days: 30
      - name: Empacotar artefato para o GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/

  # ---------------------------------------------------------------------------
  # 5. Deploy: somente a partir da main, usando exatamente o artefato do job build
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (GitHub Pages)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # ---------------------------------------------------------------------------
  # 6. Smoke test pós-deploy: confirma que a versão nova está no ar
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke test pós-deploy
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verificar aplicação publicada e commit implantado
        run: node scripts/smoke-test.mjs "${{ needs.deploy.outputs.page_url }}" --expect-commit "${{ github.sha }}" --retries 6 --delay 20

# SAST (Static Application Security Testing) com GitHub CodeQL.
# Os alertas aparecem em Security → Code scanning.
name: CodeQL (SAST)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '23 6 * * 1' # toda segunda-feira, 06:23 UTC — pega vulnerabilidades novas em código antigo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Análise CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # publicar resultados em Code scanning
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - name: Analisar
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}

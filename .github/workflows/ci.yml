# Pipeline principal de CI/CD
# Commit/PR → Dependências → Qualidade → Testes → Segurança → Build (artefato) → Deploy → Smoke test
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Princípio do menor privilégio: cada job pede apenas o que precisa.
permissions:
  contents: read

# Cancela execuções antigas do mesmo branch/PR quando chega um commit novo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Qualidade: formatação, lint/análise estática e checagem de tipos
  # ---------------------------------------------------------------------------
  quality:
    name: Qualidade (format, lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependências (lockfile exato)
        run: npm ci
      - name: Prettier (formatação)
        run: npm run format:check
      - name: ESLint (lint + análise estática + regras de segurança)
        run: npm run lint
      - name: TypeScript (checagem de tipos)
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # 2. Testes automatizados com cobertura mínima obrigatória
  # ---------------------------------------------------------------------------
  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest + cobertura (falha se < limites do vite.config.ts)
        run: npm run test:coverage
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["## 🧪 Cobertura de testes", "", "| Métrica | % | Cobertos |", "|---|---|---|",
                ...["lines","statements","functions","branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publicar relatórios de teste/cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: |
            coverage/
            reports/
          retention-days: 14
